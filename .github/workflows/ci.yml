name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Placeholder values so the build boots without real secrets.
# Validation is skipped; the health check tolerates a DB-down response.
env:
  SKIP_ENV_VALIDATION: '1'
  DATABASE_URL: 'postgresql://user:pass@localhost:5432/bookingapp'
  AUTH_SECRET: 'ci-placeholder-secret'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint & format (Biome)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: E2E tests
        run: npm run test:e2e
